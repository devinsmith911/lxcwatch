name: Release

# Pushing a vX.Y.Z tag tests that commit, builds lxcwatch_X.Y.Z_all.deb,
# publishes it to the owner's Debian registry (distribution "stable",
# component "main") and creates a release with the version's
# CHANGELOG.md section and the .deb attached. CHANGELOG.md must have a
# "## X.Y.Z" entry. Run it by hand to (re)release an existing tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.1.34
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
  PACKAGES_URL: ${{ github.server_url }}/api/packages/${{ github.repository_owner }}/debian

jobs:
  test:
    runs-on: self-hosted
    container:
      image: debian:13
    steps:
      -
        name: Check out
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates python3-venv >/dev/null
          git clone -q "$REPO_URL" src
          git -C src checkout -q "refs/tags/$TAG"
      -
        name: Check the tag and changelog
        working-directory: src
        run: |
          version=${TAG#v}
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag $TAG isn't vX.Y.Z"; exit 1; }
          grep -Eq "^## $(echo "$version" | sed 's/\./\\./g')( |$)" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## $version' entry; add one before tagging"; exit 1; }
      -
        name: Test
        working-directory: src
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -e '.[dev]'
          /tmp/venv/bin/pytest -q

  package:
    runs-on: self-hosted
    needs: test
    container:
      image: debian:13
    steps:
      -
        name: Check out
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates curl python3-pip dpkg xz-utils >/dev/null
          git clone -q "$REPO_URL" src
          git -C src checkout -q "refs/tags/$TAG"
      -
        name: Build
        working-directory: src
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: VERSION="${TAG#v}" packaging/build-deb.sh | tee /tmp/built
      -
        # Needs a PACKAGES_TOKEN secret: a token of the owner with package
        # read/write (the automatic CI token can't publish packages).
        name: Publish
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          deb="src/$(tail -n1 /tmp/built)"
          code=$(curl -s -o /tmp/response -w '%{http_code}' --user "$OWNER:$TOKEN" \
            --upload-file "$deb" "$PACKAGES_URL/pool/stable/main/upload")
          case "$code" in
            201) echo "Published $(basename "$deb")" ;;
            409) echo "$(basename "$deb") is already published (re-run?); keeping it" ;;
            *) echo "Upload failed ($code): $(cat /tmp/response)"; exit 1 ;;
          esac
      -
        # The automatic token can write this repo's releases; a RELEASE_TOKEN
        # secret (repository write) takes precedence if set.
        name: Create the release
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          version=${TAG#v}
          deb="src/$(tail -n1 /tmp/built)"
          # This version's section of the changelog, without its heading.
          awk -v h="## $version" '
            index($0, h) == 1 && (length($0) == length(h) || substr($0, length(h) + 1, 1) == " ") { on = 1; next }
            /^## / && on { exit }
            on
          ' src/CHANGELOG.md > /tmp/notes.md
          python3 - "$TAG" "$version" > /tmp/release.json <<'PY'
          import json, sys
          tag, version = sys.argv[1:]
          notes = open("/tmp/notes.md").read().strip()
          install = ("\n\n---\n\nInstall or upgrade from the apt repo with `apt update && apt install lxcwatch`, "
                     "or download the .deb below and `apt install ./lxcwatch_" + version + "_all.deb`.")
          print(json.dumps({"tag_name": tag, "name": "lxcwatch " + version, "body": notes + install}))
          PY
          auth="Authorization: token $TOKEN"
          code=$(curl -s -o /tmp/existing -w '%{http_code}' -H "$auth" "$API/releases/tags/$TAG")
          if [ "$code" = 200 ]; then
            id=$(python3 -c 'import json; print(json.load(open("/tmp/existing"))["id"])')
            code=$(curl -s -o /tmp/response -w '%{http_code}' -X PATCH -H "$auth" -H 'Content-Type: application/json' \
              --data @/tmp/release.json "$API/releases/$id")
          else
            code=$(curl -s -o /tmp/response -w '%{http_code}' -X POST -H "$auth" -H 'Content-Type: application/json' \
              --data @/tmp/release.json "$API/releases")
            id=$(python3 -c 'import json; print(json.load(open("/tmp/response")).get("id", ""))' 2>/dev/null || true)
          fi
          case "$code" in 200|201) echo "Release $TAG saved" ;; *) echo "Creating the release failed ($code): $(cat /tmp/response)"; exit 1 ;; esac
          # Attach the .deb unless it's already there.
          name=$(basename "$deb")
          if ! curl -s -H "$auth" "$API/releases/$id/assets" | grep -q "\"name\":\"$name\""; then
            code=$(curl -s -o /tmp/response -w '%{http_code}' -X POST -H "$auth" \
              -F "attachment=@$deb" "$API/releases/$id/assets?name=$name")
            case "$code" in 201) echo "Attached $name" ;; *) echo "Attaching $name failed ($code): $(cat /tmp/response)"; exit 1 ;; esac
          fi
