name: Release

# Runs on the GitHub mirror when an X.Y.Z tag arrives from the self-hosted git server. Tests that
# commit, builds lxcwatch_X.Y.Z_all.deb and creates a GitHub release with the
# version's CHANGELOG.md section and the .deb attached. Run it by hand to
# (re)release an existing tag.
#
# The mirror overwrites anything pushed here, so this must not create tags or
# commits. The release and apt repo come from the self-hosted workflows folder.
on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. 0.1.36
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    # The same image as the self-hosted workflows, so both test and build alike.
    container:
      image: debian:13
    steps:
      -
        name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates python3-venv >/dev/null
      -
        name: Check out
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      -
        name: Check the tag and changelog
        run: |
          version=$TAG
          echo "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag $TAG isn't X.Y.Z"; exit 1; }
          grep -Eq "^## $(echo "$version" | sed 's/\./\\./g')( |$)" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## $version' entry; add one before tagging"; exit 1; }
      -
        name: Test
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -e '.[dev]'
          /tmp/venv/bin/pytest -q

  package:
    runs-on: ubuntu-latest
    needs: test
    container:
      image: debian:13
    steps:
      -
        name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates python3-pip dpkg xz-utils >/dev/null
      -
        name: Check out
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      -
        name: Build
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: VERSION="$TAG" packaging/build-deb.sh
      -
        name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/lxcwatch_*_all.deb
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      -
        name: Check out
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      -
        name: Fetch the package
        uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      -
        name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$TAG
          deb="dist/lxcwatch_${version}_all.deb"
          # This version's section of the changelog, without its heading.
          awk -v h="## $version" '
            index($0, h) == 1 && (length($0) == length(h) || substr($0, length(h) + 1, 1) == " ") { on = 1; next }
            /^## / && on { exit }
            on
          ' CHANGELOG.md > /tmp/notes.md
          printf '\n---\n\nDownload the .deb below and `apt install ./lxcwatch_%s_all.deb`.\n' "$version" >> /tmp/notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$version" --notes-file /tmp/notes.md
            gh release upload "$TAG" "$deb" --clobber
          else
            gh release create "$TAG" "$deb" --verify-tag --title "$version" --notes-file /tmp/notes.md
          fi
