<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lxcwatch</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #667080; --border: #dfe3e8;
  --accent: #2f6fde; --accent-text: #ffffff; --ok: #1e8e4e; --warn: #b7791f; --bad: #c53030;
  --ok-bg: #e6f4ec; --warn-bg: #fdf3e1; --bad-bg: #fdeaea; --chip: #eef1f5; --code: #11151a; --code-text: #d8dee6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --panel: #191d23; --text: #e6e9ee; --muted: #8b95a5; --border: #2a3038;
    --accent: #5b8ff0; --accent-text: #0b0e12; --ok: #4cc27f; --warn: #e0a84a; --bad: #f07070;
    --ok-bg: #16301f; --warn-bg: #33280f; --bad-bg: #3a1818; --chip: #232931; --code: #0b0e12; --code-text: #d8dee6;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
h1 { font-size: 17px; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
main { padding: 16px 20px 80px; max-width: 1400px; margin: 0 auto; }
button { font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
input[type=search] { font: inherit; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); width: 260px; max-width: 100%; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.filters button.active { background: var(--chip); border-color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; min-width: 0; }
.stat b { display: block; font-size: 20px; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-weight: 600; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
tr:last-child td { border-bottom: 0; }
tr.selected td { background: var(--chip); }
.name { font-weight: 600; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 12px; background: var(--chip); margin: 1px 2px 1px 0; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.comp { white-space: nowrap; }
.arrow { color: var(--warn); font-weight: 600; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.bulk { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; display: none; gap: 10px; align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.18); z-index: 6; flex-wrap: wrap; max-width: calc(100% - 32px); }
.bulk.show { display: flex; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--panel); border-left: 1px solid var(--border); transform: translateX(100%); transition: transform .18s ease; z-index: 10; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer header { position: static; }
.drawer .body { overflow: auto; padding: 16px 20px; flex: 1; }
.drawer h3 { margin: 18px 0 8px; font-size: 14px; }
pre.log { background: var(--code); color: var(--code-text); padding: 12px; border-radius: 6px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; max-height: 55vh; overflow: auto; margin: 0; }
.list { border: 1px solid var(--border); border-radius: 6px; }
.list > div { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 7px 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.list > div:last-child { border-bottom: 0; }
dialog { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--text); max-width: min(520px, calc(100% - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.35); }
.err { color: var(--bad); }
label.check { display: inline-flex; gap: 6px; align-items: center; }
.pkgs { columns: 2; font: 12px ui-monospace, Menlo, monospace; }
@media (max-width: 760px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  input[type=search] { width: 100%; }
  thead { display: none; }
  table, tbody, tr, td { display: block; width: 100%; }
  tr { border-bottom: 1px solid var(--border); padding: 8px 0; }
  td { border: 0; padding: 4px 12px; }
  td[data-label]::before { content: attr(data-label) " "; color: var(--muted); font-size: 12px; }
  .pkgs { columns: 1; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>lxcwatch</h1>
    <div class="muted small" id="scaninfo">Loading…</div>
  </div>
  <div class="actions">
    <button id="scanbtn" class="primary">Scan now</button>
  </div>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <div class="filters actions" id="filters">
      <button data-f="all" class="active">All</button>
      <button data-f="updates">Needs update</button>
      <button data-f="security">Security</button>
      <button data-f="problems">Problems</button>
    </div>
    <input type="search" id="q" placeholder="Filter by name, ID, node, tag">
  </div>
  <table>
    <thead><tr>
      <th style="width:28px"><input type="checkbox" id="selall" aria-label="Select all"></th>
      <th>Container</th><th>App</th><th>OS packages</th><th>Scanned</th><th></th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<div class="bulk" id="bulk">
  <span id="bulkcount"></span>
  <label class="check"><input type="checkbox" id="bulksnap" checked> Snapshot first</label>
  <button id="bulkapp" class="primary">Update apps</button>
  <button id="bulkos">Update OS packages</button>
  <button id="bulkclear">Clear</button>
</div>

<aside class="drawer" id="drawer">
  <header>
    <div><h1 id="dtitle"></h1><div class="muted small" id="dsub"></div></div>
    <button id="dclose">Close</button>
  </header>
  <div class="body" id="dbody"></div>
</aside>

<dialog id="confirm">
  <form method="dialog">
    <h3 id="ctitle" style="margin-top:0"></h3>
    <div id="cbody"></div>
    <p><label class="check" id="csnapwrap"><input type="checkbox" id="csnap" checked> Take a snapshot first (recommended)</label></p>
    <div class="actions" style="justify-content:flex-end">
      <button value="cancel">Cancel</button>
      <button value="ok" class="primary" id="cok">Update</button>
    </div>
  </form>
</dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const state = { data: null, filter: "all", q: "", selected: new Set(), drawer: null, es: null };

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "X-Requested-With": "lxcwatch", "Content-Type": "application/json", ...(opts.headers || {}) } });
  const body = r.headers.get("content-type")?.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(body?.detail || body || r.statusText);
  return body;
}

function ago(ts) {
  if (!ts) return "never";
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 90) return "just now";
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
}

const needsUpdate = c => c.outdated > 0 || c.pkg_count > 0;
const problem = c => c.error || c.upstream_errors.length || c.components.some(x => x.pending) || c.script_state?.state === "deleted" || c.last_job?.status === "failed";

function visible() {
  const q = state.q.toLowerCase();
  return state.data.containers.filter(c => {
    if (state.filter === "updates" && !needsUpdate(c)) return false;
    if (state.filter === "security" && !c.pkg_security) return false;
    if (state.filter === "problems" && !problem(c)) return false;
    if (q && ![c.vmid, c.name, c.node, ...c.tags, c.script].join(" ").toLowerCase().includes(q)) return false;
    return true;
  });
}

function compHtml(c) {
  if (c.status !== "running" && !c.components.length) return `<span class="muted">—</span>`;
  if (!c.script) return `<span class="muted small">not a community-script</span>`;
  const parts = c.components.map(x => {
    const name = esc(x.name);
    if (x.state === "outdated") return `<div class="comp" title="${esc(x.repo)}">${name} ${esc(x.installed)} <span class="arrow">→ ${esc(x.target)}</span>${x.pinned ? ' <span class="badge">pinned</span>' : ""}</div>`;
    if (x.state === "current") {
      const behind = x.pinned && x.upstream && x.upstream !== x.target ? ` <span class="badge" title="community-scripts pins ${esc(x.target)}; upstream has ${esc(x.upstream)}">pinned</span>` : "";
      return `<div class="comp">${name} ${esc(x.installed)} <span class="badge ok">current</span>${behind}</div>`;
    }
    return `<div class="comp">${name} ${esc(x.installed ?? "?")} <span class="badge">${x.state === "untracked" ? "untracked" : "unknown"}</span></div>`;
  });
  if (c.components.some(x => x.pending)) parts.push(`<span class="badge bad">last update did not finish</span>`);
  if (c.script_state?.state === "deleted") parts.push(`<span class="badge bad">removed from community-scripts</span>`);
  if (!parts.length) parts.push(`<span class="muted small">${esc(c.script)} · updates via OS packages</span>`);
  return parts.join("");
}

function pkgHtml(c) {
  if (!c.pkgmgr) return `<span class="muted">—</span>`;
  if (!c.pkg_count) return `<span class="badge ok">up to date</span>${c.reboot_required ? ' <span class="badge warn">reboot</span>' : ""}`;
  return `<span class="badge warn">${c.pkg_count} pending</span>${c.pkg_security ? ` <span class="badge bad">${c.pkg_security} security</span>` : ""}${c.reboot_required ? ' <span class="badge warn">reboot</span>' : ""}`;
}

function rowHtml(c) {
  const running = c.status === "running";
  const busy = !!c.job;
  const status = running ? "" : ` <span class="badge">${esc(c.status)}</span>`;
  const err = c.error ? `<div class="err small">${esc(c.error)}</div>` : "";
  const upErr = c.upstream_errors.length ? `<div class="err small">${esc(c.upstream_errors.join("; "))}</div>` : "";
  const job = busy ? `<span class="badge warn">updating…</span>` : c.last_job?.status === "failed" ? `<span class="badge bad">last ${esc(c.last_job.kind)} job failed</span>` : "";
  return `<tr class="${state.selected.has(c.vmid) ? "selected" : ""}">
    <td><input type="checkbox" data-sel="${c.vmid}" ${state.selected.has(c.vmid) ? "checked" : ""} aria-label="Select ${c.vmid}"></td>
    <td><div class="name">${c.vmid} · ${esc(c.name)}${status}</div>
        <div class="muted small">${esc([c.node, c.os].filter(Boolean).join(" · "))}</div>
        <div>${c.tags.map(t => `<span class="badge">${esc(t)}</span>`).join("")}</div>${err}</td>
    <td data-label="App:">${compHtml(c)}${upErr}</td>
    <td data-label="OS:">${pkgHtml(c)}</td>
    <td data-label="Scanned:" class="small muted">${c.scanning ? "scanning…" : ago(c.scanned_at)}</td>
    <td><div class="actions">
      ${job}
      <button data-act="app" data-id="${c.vmid}" ${!running || busy || !c.script ? "disabled" : ""} class="${c.outdated ? "primary" : ""}">Update app</button>
      <button data-act="os" data-id="${c.vmid}" ${!running || busy || !c.pkgmgr ? "disabled" : ""}>Update OS</button>
      <button data-act="details" data-id="${c.vmid}">Details</button>
    </div></td></tr>`;
}

function render() {
  const d = state.data;
  if (!d) return;
  const cs = d.containers;
  const s = d.scan;
  $("#scaninfo").textContent = s.running ? "Scanning…" : s.last ? `Last scan ${ago(s.last.at)} · ${s.last.count} containers in ${s.last.took}s${s.interval_minutes > 0 ? ` · every ${s.interval_minutes}m` : ""}` : "Not scanned yet";
  if (s.error) $("#scaninfo").innerHTML += ` · <span class="err">${esc(s.error)}</span>`;
  $("#scanbtn").disabled = s.running;
  const stats = [
    ["Containers", cs.length],
    ["App updates", cs.reduce((n, c) => n + c.outdated, 0)],
    ["With package updates", cs.filter(c => c.pkg_count).length],
    ["Security", cs.reduce((n, c) => n + c.pkg_security, 0)],
    ["Problems", cs.filter(problem).length],
  ];
  $("#stats").innerHTML = stats.map(([k, v]) => `<div class="stat"><b>${v}</b><span class="muted small">${k}</span></div>`).join("");
  const rows = visible();
  $("#rows").innerHTML = rows.length ? rows.map(rowHtml).join("") : `<tr><td colspan="6" class="muted">Nothing here.</td></tr>`;
  $("#selall").checked = rows.length > 0 && rows.every(c => state.selected.has(c.vmid));
  const n = state.selected.size;
  $("#bulk").classList.toggle("show", n > 0);
  $("#bulkcount").textContent = `${n} selected`;
  if (state.drawer?.type === "ct") renderDetails(false);
}

async function refresh() {
  try {
    state.data = await api("/api/containers");
    const ids = new Set(state.data.containers.map(c => c.vmid));
    for (const id of state.selected) if (!ids.has(id)) state.selected.delete(id);
    render();
  } catch (e) {
    $("#scaninfo").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
}

function confirmUpdate(kind, vmids) {
  const cs = state.data.containers.filter(c => vmids.includes(c.vmid));
  $("#ctitle").textContent = kind === "app" ? `Run the app update on ${cs.length} container${cs.length > 1 ? "s" : ""}?` : `Upgrade OS packages on ${cs.length} container${cs.length > 1 ? "s" : ""}?`;
  $("#cbody").innerHTML = `<div class="list">${cs.map(c => {
    const what = kind === "app"
      ? (c.components.filter(x => x.state === "outdated").map(x => `${esc(x.name)} ${esc(x.installed)} → ${esc(x.target)}`).join(", ") || "runs <code>update</code> (also upgrades OS packages)")
      : `${c.pkg_count} package${c.pkg_count === 1 ? "" : "s"}`;
    return `<div><span>${c.vmid} · ${esc(c.name)}</span><span class="muted small">${what}</span></div>`;
  }).join("")}</div>`;
  $("#csnap").checked = $("#bulksnap").checked;
  const dlg = $("#confirm");
  dlg.returnValue = "";
  dlg.showModal();
  return new Promise(res => dlg.addEventListener("close", () => res(dlg.returnValue === "ok" ? { snapshot: $("#csnap").checked } : null), { once: true }));
}

async function startUpdate(kind, vmids) {
  const ok = await confirmUpdate(kind, vmids);
  if (!ok) return;
  try {
    const r = await api("/api/update", { method: "POST", body: JSON.stringify({ vmids, kind, snapshot: ok.snapshot }) });
    const errs = Object.entries(r.errors);
    if (errs.length) alert(errs.map(([id, e]) => `${id}: ${e}`).join("\n"));
    const started = Object.entries(r.jobs);
    if (started.length === 1) openJob(started[0][1], Number(started[0][0]));
    state.selected.clear();
    await refresh();
  } catch (e) { alert(e.message); }
}

function openDrawer(title, sub) {
  $("#dtitle").textContent = title;
  $("#dsub").textContent = sub || "";
  $("#drawer").classList.add("open");
}

function closeDrawer() {
  $("#drawer").classList.remove("open");
  state.drawer = null;
  if (state.es) { state.es.close(); state.es = null; }
}

async function openDetails(vmid) {
  if (state.es) { state.es.close(); state.es = null; }
  state.drawer = { type: "ct", vmid, snaps: null, jobs: null };
  renderDetails(true);
  const [snaps, jobs] = await Promise.allSettled([api(`/api/containers/${vmid}/snapshots`), api(`/api/jobs?vmid=${vmid}`)]);
  if (state.drawer?.vmid !== vmid) return;
  state.drawer.snaps = snaps;
  state.drawer.jobs = jobs;
  renderDetails(false);
}

function renderDetails(first) {
  const dr = state.drawer;
  const c = state.data.containers.find(x => x.vmid === dr.vmid);
  if (!c) return closeDrawer();
  if (first) openDrawer(`${c.vmid} · ${c.name}`, `${c.node} · ${c.os || ""}${c.script ? ` · ct/${c.script}.sh` : ""}`);
  const comps = c.components.length ? `<div class="list">${c.components.map(x => `<div><span>${esc(x.name)} <span class="muted small">${esc(x.repo || "")}</span></span>
      <span class="small">installed ${esc(x.installed ?? "?")} · target ${esc(x.target ?? "?")}${x.upstream && x.upstream !== x.target ? ` · upstream ${esc(x.upstream)}` : ""}</span></div>`).join("")}</div>`
    : `<p class="muted">No tracked app versions.</p>`;
  const pk = c.packages.length ? `<div class="pkgs">${c.packages.map(p => `<div>${p.security ? "⚠ " : ""}${esc(p.name)} ${esc(p.from || "")} → ${esc(p.to)}</div>`).join("")}</div>` : `<p class="muted">No pending packages.</p>`;
  let snaps = `<p class="muted">Loading…</p>`;
  if (dr.snaps?.status === "rejected") snaps = `<p class="err">${esc(dr.snaps.reason.message)}</p>`;
  else if (dr.snaps) snaps = dr.snaps.value.length ? `<div class="list">${dr.snaps.value.map(s => `<div><span>${esc(s.name)} <span class="muted small">${s.snaptime ? new Date(s.snaptime * 1000).toLocaleString() : ""} ${esc(s.description || "")}</span></span>
      <span class="actions"><button data-rollback="${esc(s.name)}" ${c.job ? "disabled" : ""}>Roll back</button><button class="danger" data-delsnap="${esc(s.name)}" ${c.job ? "disabled" : ""}>Delete</button></span></div>`).join("")}</div>` : `<p class="muted">No snapshots.</p>`;
  let jobs = `<p class="muted">Loading…</p>`;
  if (dr.jobs?.status === "fulfilled") jobs = dr.jobs.value.length ? `<div class="list">${dr.jobs.value.map(j => `<div><span>${esc(j.kind)} · ${new Date(j.created_at * 1000).toLocaleString()}</span>
      <span class="actions"><span class="badge ${j.status === "success" ? "ok" : j.status === "failed" ? "bad" : "warn"}">${esc(j.status)}${j.rc != null && j.rc !== 0 ? ` (${j.rc})` : ""}</span><button data-job="${esc(j.id)}">Log</button></span></div>`).join("")}</div>` : `<p class="muted">No jobs yet.</p>`;
  $("#dbody").innerHTML = `
    <div class="actions">
      <button data-act="app" data-id="${c.vmid}" ${c.status !== "running" || c.job || !c.script ? "disabled" : ""} class="primary">Update app</button>
      <button data-act="os" data-id="${c.vmid}" ${c.status !== "running" || c.job || !c.pkgmgr ? "disabled" : ""}>Update OS</button>
      <button data-rescan="${c.vmid}" ${c.scanning || c.status !== "running" ? "disabled" : ""}>${c.scanning ? "Scanning…" : "Rescan"}</button>
      ${c.job ? `<button data-job="${esc(c.job)}">Live log</button>` : ""}
    </div>
    ${c.error ? `<p class="err">${esc(c.error)}</p>` : ""}
    <h3>App versions</h3>${comps}
    <h3>Pending OS packages (${c.pkg_count})</h3>${pk}
    <h3>Snapshots</h3>${snaps}
    <h3>Job history</h3>${jobs}`;
}

function openJob(id, vmid) {
  if (state.es) state.es.close();
  state.drawer = { type: "job", id, vmid };
  const c = state.data?.containers.find(x => x.vmid === vmid);
  openDrawer(`Job log${c ? ` · ${c.vmid} ${c.name}` : ""}`, id);
  $("#dbody").innerHTML = `<div class="actions" style="margin-bottom:10px"><span id="jstatus" class="badge warn">connecting…</span>${vmid ? `<button data-back="${vmid}">Back to container</button>` : ""}</div><pre class="log" id="jlog"></pre>`;
  const pre = $("#jlog");
  const es = new EventSource(`/api/jobs/${encodeURIComponent(id)}/stream`);
  state.es = es;
  es.onopen = () => { $("#jstatus").textContent = "running"; };
  es.onmessage = ev => {
    const stick = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
    pre.textContent += JSON.parse(ev.data) + "\n";
    if (stick) pre.scrollTop = pre.scrollHeight;
  };
  es.addEventListener("done", ev => {
    const r = JSON.parse(ev.data);
    const st = $("#jstatus");
    st.textContent = r.status + (r.rc != null && r.rc !== 0 ? ` (exit ${r.rc})` : "");
    st.className = `badge ${r.status === "success" ? "ok" : "bad"}`;
    es.close();
    if (state.es === es) state.es = null;
    refresh();
  });
  es.onerror = () => { if (es.readyState === EventSource.CLOSED) $("#jstatus").textContent = "disconnected"; };
}

document.addEventListener("click", async ev => {
  const t = ev.target.closest("button, input[type=checkbox]");
  if (!t) return;
  if (t.matches("[data-f]")) {
    state.filter = t.dataset.f;
    document.querySelectorAll("#filters button").forEach(b => b.classList.toggle("active", b === t));
    render();
  } else if (t.matches("[data-sel]")) {
    const id = Number(t.dataset.sel);
    t.checked ? state.selected.add(id) : state.selected.delete(id);
    render();
  } else if (t.id === "selall") {
    for (const c of visible()) t.checked ? state.selected.add(c.vmid) : state.selected.delete(c.vmid);
    render();
  } else if (t.dataset.act === "details") {
    openDetails(Number(t.dataset.id));
  } else if (t.dataset.act) {
    startUpdate(t.dataset.act, [Number(t.dataset.id)]);
  } else if (t.id === "bulkapp" || t.id === "bulkos") {
    const kind = t.id === "bulkapp" ? "app" : "os";
    const ids = state.data.containers.filter(c => state.selected.has(c.vmid) && c.status === "running" && !c.job && (kind === "os" ? c.pkgmgr : c.script)).map(c => c.vmid);
    if (!ids.length) return alert("None of the selected containers can run that update.");
    startUpdate(kind, ids);
  } else if (t.id === "bulkclear") {
    state.selected.clear(); render();
  } else if (t.id === "scanbtn") {
    await api("/api/scan", { method: "POST" }).catch(e => alert(e.message));
    refresh();
  } else if (t.id === "dclose") {
    closeDrawer();
  } else if (t.dataset.job) {
    openJob(t.dataset.job, state.drawer?.vmid);
  } else if (t.dataset.back) {
    openDetails(Number(t.dataset.back));
  } else if (t.dataset.rescan) {
    const id = Number(t.dataset.rescan);
    const c = state.data.containers.find(x => x.vmid === id); if (c) c.scanning = true; render();
    await api(`/api/containers/${id}/scan`, { method: "POST" }).catch(e => alert(e.message));
    refresh();
  } else if (t.dataset.rollback) {
    const vmid = state.drawer.vmid, name = t.dataset.rollback;
    if (!confirm(`Roll CT ${vmid} back to ${name}? Everything changed since that snapshot is lost. The container is restarted if it was running.`)) return;
    try { const r = await api(`/api/containers/${vmid}/snapshots/${encodeURIComponent(name)}/rollback`, { method: "POST" }); openJob(r.job, vmid); refresh(); }
    catch (e) { alert(e.message); }
  } else if (t.dataset.delsnap) {
    const vmid = state.drawer.vmid, name = t.dataset.delsnap;
    if (!confirm(`Delete snapshot ${name} of CT ${vmid}?`)) return;
    t.disabled = true;
    try { await api(`/api/containers/${vmid}/snapshots/${encodeURIComponent(name)}`, { method: "DELETE" }); openDetails(vmid); }
    catch (e) { alert(e.message); t.disabled = false; }
  }
});
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#drawer").classList.contains("open") && !$("#confirm").open) closeDrawer(); });

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
