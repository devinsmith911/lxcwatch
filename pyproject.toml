[project]
name = "lxcwatch"
version = "2.1.0"
description = "Track and update community-scripts LXCs across a Proxmox cluster"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "PyJWT>=2.8",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lxcwatch"]

[tool.setuptools.package-data]
lxcwatch = ["static/*", "static/css/*", "static/js/*"]
